name: KissAt
options:
  bundleIdPrefix: com.elewenwl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""

targets:
  KissAt:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "KissAt"
        PRODUCT_BUNDLE_IDENTIFIER: com.elewenwl.kissat
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
