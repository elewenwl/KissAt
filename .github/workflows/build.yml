name: Build KissAt IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

     
      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build AirliftFFI.xcframework
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework \
            -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a \
            -headers rust-core/include \
            -library rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a \
            -output AirliftFFI.xcframework
      

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project KissAt.xcodeproj \
            -scheme KissAt \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/KissAt.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/KissAt.xcarchive/Products/Applications/KissAt.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          ditto -c -k --sequesterRsrc --keepParent Payload KissAt.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KissAt-ipa
          path: ${{ runner.temp }}/KissAt.ipa
