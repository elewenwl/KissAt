name: Build KissAt IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project KissAt.xcodeproj \
            -scheme KissAt \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/KissAt.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/KissAt.xcarchive/Products/Applications/KissAt.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          ditto -c -k --sequesterRsrc --keepParent Payload KissAt.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KissAt-ipa
          path: ${{ runner.temp }}/KissAt.ipa
